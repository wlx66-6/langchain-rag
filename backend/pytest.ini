[pytest]
testpaths = tests
pythonpath = .

# 默认只跑「快测试」：需要真实向量库的集成测试、需要真实调用大模型的端到端测试一律跳过，
# 避免无网络/无 API Key 的环境下误报失败。按需运行：
#   pytest -m integration     # 只跑集成测试
#   pytest -m e2e             # 只跑端到端测试（会真实调用百炼，产生费用）
addopts = -m "not integration and not e2e"

markers =
    integration: 需要真实数据库/向量库等本地依赖的集成测试，默认跳过
    e2e: 需要真实调用大模型（百炼）的端到端测试，默认跳过

# 覆盖率（可写进简历的门槛值）用法：
#   pytest --cov=app --cov-report=term-missing --cov-fail-under=70
#   pytest --cov=app --cov-report=html        # 生成 htmlcov/ 网页报告